
  <div
    class="absolute inset-0 flex flex-col items-center justify-center bg-[rgba(240,240,240,0.8)] backdrop-blur-sm rounded-md z-10 animate-fade-in">
    <div class="bg-white/90 p-6 rounded-lg shadow-lg text-center max-w-xs w-[90%]">

      <h2 class="text-2xl text-gray-800 mb-2">
        {{ gameWon() ? '¡Has ganado! :)' : 'Has perdido :(' }}
      </h2>

      <p class="text-gray-700 mb-4">
        Tu puntuación ha sido: <span class="font-bold">{{ score() }}</span>
      </p>

      <div class="flex flex-col gap-2">
        <button
          class="bg-game-base_button text-white rounded-sm py-2 hover:bg-opacity-80 transition"
          (click)="restart.emit()">
          Volver a empezar
        </button>

        @if (gameWon()) {
          <button
            class="bg-green-500 text-white font-semibold rounded-sm py-2 hover:bg-green-600 transition"
            (click)="continue.emit()">
            Continuar jugando
          </button>
        }
      </div>

    </div>
  </div>
