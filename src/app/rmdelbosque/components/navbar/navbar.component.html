<nav
  class="bg-white dark:bg-slate-900 fixed w-full z-20 top-0 start-0 border-b border-gray-200 dark:border-gray-600 transition-colors duration-500">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    <navbar-icon />

    <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
      <theme-button />

      <button type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden
         hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200
         dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600" aria-controls="navbar-menu"
        [attr.aria-expanded]="isMenuOpen" (click)="toggleMenu()">
        <span class="sr-only">Open main menu</span>
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M1 1h15M1 7h15M1 13h15" />
        </svg>
      </button>
    </div>

    <!-- Aquí escuchamos el evento closeMenu -->
    <div id="navbar-menu" class="w-full md:flex md:w-auto md:order-1 transition-all duration-300 ease-in-out"
      [class.hidden]="!isMenuOpen">
      <navbar-options (closeMenu)="closeMenu()"></navbar-options>
    </div>
  </div>
</nav>
