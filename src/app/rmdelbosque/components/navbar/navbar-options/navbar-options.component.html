<ul class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-100 rounded-lg
         md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 dark:border-gray-700">
  @for (item of menuOptions; track item.route) {
  <li>
    <a [routerLink]="item.route" (click)="closeMenu.emit()" routerLinkActive="dark:text-green_3 text-green_3 "
      [routerLinkActiveOptions]="{ exact: true }" class="block py-2 px-3 rounded-sm hover:bg-green-100 md:hover:bg-transparent
               md:hover:text-green-700 md:p-0 md:dark:hover:text-green-500 dark:text-white
               dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent
               dark:border-gray-700 text-lg">
      {{ item.label }}
    </a>
  </li>
  }
</ul>
