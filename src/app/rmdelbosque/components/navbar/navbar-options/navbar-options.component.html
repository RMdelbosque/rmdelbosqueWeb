<ul
  class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-100 rounded-lg bg-gray-50
         md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white
         dark:bg-gray-800 md:dark:bg-gray-900 dark:border-gray-700 transition-all duration-500">
  @for (item of menuOptions; track item.route) {
    <li>
      <a
        [routerLink]="item.route"
        (click)="closeMenu.emit()"
        routerLinkActive="md:dark:text-green-500 md:text-green-600 transition-all duration-500"
        [routerLinkActiveOptions]="{ exact: true }"
        class="block py-2 px-3 rounded-sm hover:bg-gray-100 md:hover:bg-transparent
               md:hover:text-green-700 md:p-0 md:dark:hover:text-green-500 dark:text-white
               dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent
               dark:border-gray-700 transition-colors duration-500"
      >
        {{ item.label }}
      </a>
    </li>
  }
</ul>
