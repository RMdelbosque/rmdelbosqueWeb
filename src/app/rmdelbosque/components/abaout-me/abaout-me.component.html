<div class="max-w-5xl mx-auto px-4 mt-6">
  <div class="md:flex md:items-start md:gap-6">

    <!-- Botonera (izquierda en desktop, arriba en móvil) -->
    <div class="flex gap-3 mb-4 md:mb-0 md:flex-col md:w-40">
      <button
      type="button"
      (click)="select('presentation')"
      [attr.aria-pressed]="isActive('presentation')"
      class="flex items-center text-lg gap-2 px-3 py-2 rounded-md w-full transition-all focus:outline-none focus:ring-2 focus:ring-green_3 dark:focus:ring-green_5"
      [ngClass]="
        isActive('presentation')
          ? 'bg-gradient-to-br from-green_3 to-green_5 text-black shadow-md'
          : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 hover:bg-green_100 dark:hover:bg-green_900/40'
      ">
        <i class="fa-solid fa-user"></i>
        Presentación
      </button>


      <button
      type="button"
      (click)="select('skills')"
      [attr.aria-pressed]="isActive('skills')"
      class="flex items-center gap-2 px-3 py-2 rounded-md text-lg font-medium w-full transition-all focus:outline-none focus:ring-2 focus:ring-green_3 dark:focus:ring-green_5"
      [ngClass]="
        isActive('skills')
          ? 'bg-gradient-to-br from-green_3 to-green_5 text-black shadow-md'
          : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 hover:bg-green_100 dark:hover:bg-green_900/40'
      ">
        <i class="fa-solid fa-user-gear"></i>
        Aptitudes
      </button>
    </div>

    <!-- Zona de contenido (derecha) -->
    <div>
      @if (active === 'presentation') {
      <div data-aos="flip-left">
        <app-presentacion />
        <br>
      </div>
      }

      @if (active === 'skills') {
      <div data-aos="flip-left">
        <app-skills />
      </div>
      }


    </div>

  </div>

</div>
<div class="max-w-7xl mx-auto px-4 ">
  <app-timeline />
</div>
