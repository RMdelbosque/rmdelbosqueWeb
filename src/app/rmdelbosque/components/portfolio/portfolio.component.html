
<h2 class="text-3xl text-gray-900 dark:text-white mb-4">
  Mis proyectos de GitHub
</h2>
<p>Aquí tenéis un ejemplo de proyectos que he realizado. <br>¡Espero que os guste!</p>

@if (gihubReposLoading()) {
<div class="text-gray-500 bt-4 dark:text-gray-300">Cargando repositorios...</div>
} @else {
<div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 ">
  @for (repo of gitHubRepos(); track repo) {
  <app-github-repo-list [gitHubRepo]="repo" />
  }
</div>
}
