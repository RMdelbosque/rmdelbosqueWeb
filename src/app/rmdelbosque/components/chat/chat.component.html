<!-- Contenedor flotante -->
<div class="fixed bottom-6 right-6 z-50">
  <!-- @if: chat cerrado -->
  @if (!isOpen()) {
    <button
      (click)="toggleChat()"
      class="bg-green_3 text-white p-4 rounded-full shadow-lg hover:scale-110 transition-transform"
      title="Abrir chat"
    >
      💬
    </button>
  }

  <!-- @if: chat abierto -->
  @if (isOpen()) {
    <div
      class="w-80 h-96 bg-white dark:bg-gray-800 rounded-xl shadow-2xl flex flex-col overflow-hidden border transition-all border-green_3/30 shadow-green_3/30"
    >
      <!-- Header -->
      <div class="px-4 py-2 flex justify-between items-center bg-gradient-to-br from-green_3 to-green_5 text-black shadow-md">
        <span class="font-semibold text-lg">Asistente de Rodrigo</span>
        <img src="img/pj.png" alt="Rodrigo Pixelado" class="h-8 w-8">
        <button (click)="toggleChat()" class="text-black text-xl hover:text-gray-300">✖</button>
      </div>

      <div class="flex-1 overflow-y-auto p-3 space-y-2 text-base">
        @for (msg of messages(); track $index) {
          <div [class.text-right]="msg.sender === 'user'" [class.text-left]="msg.sender === 'bot'">
            <div
              [ngClass]="{
                'bg-gradient-to-br from-green_3/80 to-green_5/80 text-black ml-auto': msg.sender === 'user',
                'bg-gray-200 dark:bg-gray-700 dark:text-gray-100 mr-auto': msg.sender === 'bot'
              }"
              class="px-3 py-2 rounded-lg max-w-[80%] inline-block whitespace-pre-wrap"
            >
              {{ msg.text }}
            </div>
          </div>
        }
      </div>

      <!-- Input -->
      <div class="p-2 border-t border-gray-200 dark:border-gray-700 flex gap-2">
        <input
          [value]="userMessage()"
          (input)="userMessage.set(($any($event.target)).value)"
          (keyup.enter)="sendMessage()"
          type="text"
          placeholder="Escribe tu mensaje..."
          class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm focus:outline-none"
        />
        <button
          (click)="sendMessage()"
          class="bg-green_3 text-white px-3 py-2 rounded-lg hover:bg-green_4 transition-colors"
        >
          ➤
        </button>
      </div>
    </div>
  }
</div>
