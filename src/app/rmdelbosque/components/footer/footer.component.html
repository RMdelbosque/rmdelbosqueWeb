<footer class="w-full bg-stone-200 dark:bg-slate-700 transition-colors duration-500 fixed inset-x-0 bottom-0 border-t-2 border-gray-600 dark:border-gray-300 p-4">
  <div class="flex items-center justify-between gap-4 px-4 sm:px-20 min-w-0">
    <!-- Nombre: ocupa el espacio disponible y se trunca si hace falta -->
    <span class="flex-1 min-w-0 text-sm text-gray-500 dark:text-gray-400 truncate">
      {{ envs.companyName }}
    </span>

    <!-- Iconos: no se encogen, siempre a la derecha -->
    <div class="flex items-center gap-4 flex-none">
      <a href="{{ envs.linkedin }}" target="_blank"
         class="text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin fa-lg"></i>
      </a>

      <a href="{{ envs.github }}" target="_blank"
         class="text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors" aria-label="GitHub">
        <i class="fa-brands fa-github fa-lg"></i>
      </a>
    </div>
  </div>
</footer>
