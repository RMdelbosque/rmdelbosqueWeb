<div class="max-w-5xl mx-auto px-4 py-12">

  <!-- Título -->
  <h2 class="text-3xl font-bold mb-8 text-gray-900 dark:text-white transition-all duration-500">
    📩 Contáctame
  </h2>

  <!-- Sección de contacto directo -->
  <div class="flex flex-wrap gap-4 mb-10">
    <a href="https://wa.me/34654859387" target="_blank"
      class="flex items-center gap-3 px-4 py-2 rounded-md bg-green-500 text-white font-medium hover:bg-green-600 transition-all duration-300">
      <i class="fa-brands fa-whatsapp text-xl"></i>
      WhatsApp
    </a>

    <button (click)="callPhone()"
      class="flex items-center gap-3 px-4 py-2 rounded-md bg-blue-500 text-white font-medium hover:bg-blue-600 transition-all duration-300">
      <i class="fa-solid fa-phone text-xl"></i>
      Llamar
    </button>

    <a target="_blank"
      class="flex items-center gap-3 px-4 py-2 rounded-md bg-red-500 text-white font-medium hover:bg-red-600 transition-all duration-300">
      <i class="fa-solid fa-envelope text-xl"></i>
      rodrigo.m.delbosque&#64;gmail.com
    </a>
  </div>

  <!-- Formulario -->
  <form (submit)="sendEmail($event)" class="grid gap-6">

    <!-- Nombre -->
    <div>
      <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Nombre *</label>
      <input type="text" [(ngModel)]="formData.name" name="name" required
        class="w-full p-3 border rounded-md bg-transparent border-gray-300 text-sm
               dark:border-gray-600 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all duration-300">
    </div>

    <!-- Correo -->
    <div>
      <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Correo electrónico *</label>
      <input type="email" [(ngModel)]="formData.email" name="email" required
        class="w-full p-3 border rounded-md bg-transparent border-gray-300 text-sm
               dark:border-gray-600 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all duration-300">
    </div>

    <!-- Teléfono -->
    <div>
      <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Teléfono</label>
      <input type="tel" [(ngModel)]="formData.phone" name="phone"
        class="w-full p-3 border rounded-md bg-transparent border-gray-300 text-sm
               dark:border-gray-600 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all duration-300">
    </div>

    <!-- Mensaje -->
    <div>
      <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Mensaje *</label>
      <textarea [(ngModel)]="formData.message" name="message" rows="4" required
        class="w-full p-3 border rounded-md bg-transparent border-gray-300 text-sm
               dark:border-gray-600 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all duration-300"></textarea>
    </div>

    <!-- Botón de envío -->
    <button type="submit" [disabled]="sending"
      class="w-full py-3 px-5 text-white font-medium rounded-md bg-sky-600 hover:bg-sky-700
             dark:bg-sky-500 dark:hover:bg-sky-400 disabled:opacity-50 transition-all duration-300">
      {{ sending ? 'Enviando...' : 'Enviar' }}
    </button>

    <!-- Mensajes -->
    @if (success) {
      <p class="text-green-500 text-sm mt-2">{{ success }}</p>
    }
    @if (error) {
      <p class="text-red-500 text-sm mt-2">{{ error }}</p>
    }
  </form>

</div>
